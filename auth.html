<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توعية | تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050810;
            --card-bg: #0b0f19;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 40%);
        }

        /* زر العودة للرئيسية */
        .back-home {
            position: absolute;
            top: 25px;
            right: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
            z-index: 10;
        }

        .back-home:hover {
            color: var(--accent);
        }

        /* حاوية نموذج تسجيل الدخول مع تأثير الإضاءة والـ Border المتوهج */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            margin: auto 0;
            animation: boxFadeIn 0.8s ease-out;
        }

        @keyframes boxFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🌟 تأثير شعاع الضوء المتحرك (Light Beam/Sweep) المماثل للفيديو 🌟 */
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(56, 189, 248, 0.08) 48%,
                rgba(245, 158, 11, 0.15) 50%, /* ومضة شعاع الضوء الذهبي/الأزرق */
                rgba(56, 189, 248, 0.08) 52%,
                transparent 55%
            );
            transform: rotate(35deg);
            animation: lightSweep 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes lightSweep {
            0% { transform: translateY(-100%) rotate(35deg); }
            50% { transform: translateY(100%) rotate(35deg); }
            100% { transform: translateY(-100%) rotate(35deg); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
            z-index: 2;
        }

        .login-header .bulb-icon {
            font-size: 32px;
            color: var(--gold);
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--accent);
        }

        .forgot-pass {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .forgot-pass:hover {
            opacity: 0.8;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            position: relative;
            z-index: 2;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.5);
        }

        .login-footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
            position: relative;
            z-index: 2;
        }

        .login-footer-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        /* روابط التواصل السريع المصغرة أسفل الصفحة */
        .quick-contact-bar {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
            font-size: 13px;
            z-index: 10;
        }

        .quick-contact-bar a {
            color: var(--text-muted);
            text-decoration: none;
            background: rgba(30, 41, 59, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .quick-contact-bar a.wa:hover { border-color: #25D366; color: #25D366; }
        .quick-contact-bar a.ph:hover { border-color: var(--accent); color: var(--accent); }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            width: 100%;
        }

        @media(max-width: 480px) {
            .login-wrapper { padding: 30px 20px; }
            .back-home { top: 15px; right: 20px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-right"></i> الرئيسية
    </a>

    <div></div> <!-- مسافة توازنية -->

    <!-- نافذة تسجيل الدخول مع تأثير الضوء المتحرك -->
    <div class="login-wrapper">
        <div class="login-header">
            <i class="fa-solid fa-lightbulb bulb-icon"></i>
            <h1>مرحباً بك مجدداً</h1>
            <p>سجل دخولك لمتابعة خدمات منصة توعية</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح!');">
            <div class="form-group">
                <label>البريد الإلكتروني</name>
                <input type="email" class="form-control" placeholder="name@example.com" required>

        <div class="login-footer-text">

        </div>
    </div>

    <!-- شريط التواصل السريع بالأسفل -->
    <div>
        <div class="quick-contact-bar">
            <a href="https://wa.me/21696937831" target="_blank" class="wa">
                <i class="fa-brands fa-whatsapp"></i> 96 937 831
            </a>
            <a href="tel:+21696994195" class="ph">
                <i class="fa-solid fa-phone"></i> 96 994 195
            </a>
        </div>
        <footer>
            توعية • TAWIYA — 2026
        </footer>
    </div>

</body>
</html>
